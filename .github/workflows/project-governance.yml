name: Validate Azure Mines development contract

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation and toolchain and negative cases
        run: python3 scripts/self_test.py
      - name: Test persistent browser preview without Godot
        run: python3 scripts/test_codespaces_web_preview.py
      - name: Verify project context is completed
        run: python3 scripts/validate_template.py --project
