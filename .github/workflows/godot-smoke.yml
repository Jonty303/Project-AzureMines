name: Godot 4.5.2 Combat Lab smoke tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Godot 4.5.2
        run: |
          curl --fail --location --retry 3 --output godot.zip             https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          echo "87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  godot.zip" | sha256sum --check --status
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Import and parse Combat Lab
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E -q 'SCRIPT ERROR|Parse Error|Failed to load script|(^| )ERROR:|CRC error|incorrect data check' import.log; then
            exit 1
          fi
      - name: Launch title screen headlessly
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --quit-after 30 2>&1 | tee startup.log
          if grep -E -q 'SCRIPT ERROR|Parse Error|Failed to load script|(^| )ERROR:' startup.log; then
            exit 1
          fi
      - name: Rules and Combat Lab regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in             test_canonical_party             test_combat_engine             test_combat_playthrough             test_level1_features             test_sprite_assets             test_reactions_and_disengage             test_shield_and_bless             test_wagon_camp             test_action_bar_and_downed             test_audio_and_contextual_ui             test_party_deployment             test_combat_lab_setup             test_combat_lab_ui             test_web_touch_input             test_combat_lab_v03_feedback             test_v04_wide_camera_projectiles             test_v041_downed_auto_turn             test_v041_movement_impact             test_v043_tactical_ai             test_v043_spell_ui             test_v051_spell_slots             test_v051_magic_menus             test_v052_persistent_effects             test_v052_effect_presentation
          do
            echo "::group::$test"
            ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script "res://tests/$test.gd"
            echo "::endgroup::"
          done
