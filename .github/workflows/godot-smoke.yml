name: Godot 4.5.2 smoke tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.5.2
        run: |
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Import Godot project (fail on script and asset errors)
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E -q 'SCRIPT ERROR|Parse Error|Failed to load script|(^| )ERROR:|CRC error|incorrect data check' import.log; then
            echo "Godot reported a script or asset import error"
            exit 1
          fi
      - name: Launch combat UI headlessly (fail on script errors)
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --quit-after 30 2>&1 | tee startup.log
          if grep -E -q 'SCRIPT ERROR|Parse Error|Failed to load script|(^| )ERROR:' startup.log; then
            echo "Godot reported a script or runtime error during startup"
            exit 1
          fi
      - name: Module loader test
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_module_loader.gd
      - name: Canonical party test
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_canonical_party.gd
      - name: Combat engine test
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_combat_engine.gd
      - name: Complete encounter playthrough test
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_combat_playthrough.gd
      - name: Combat UI integration smoke test
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_combat_ui.gd
      - name: Level-1 features and spell resources
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_level1_features.gd
      - name: 64px combat sprite validation
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_sprite_assets.gd
      - name: Downed assets and action bar regression test
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_action_bar_and_downed.gd
      - name: Original audio and contextual action-bar regression
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_audio_and_contextual_ui.gd
      - name: Opportunity Attacks and Disengage integration
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_reactions_and_disengage.gd
      - name: Shield reaction and Bless concentration
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_shield_and_bless.gd
      - name: Four-goblin campsite, hazards and cover
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_wagon_camp.gd
      - name: Party setup, formations and manual deployment
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/test_party_deployment.gd
